<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>City Walk Tracker & GPX Recorder</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #111111;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --status-green: #10b981;
      --status-yellow: #f59e0b;
      --status-red: #ef4444;
      --accent-blue: #2563eb;
      --accent-orange: #ea580c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #dashboard {
      position: sticky;
      top: 0;
      background-color: var(--card-bg);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
      z-index: 2000;
    }

    .start-addr-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: #18181b;
      padding: 4px 8px;
      border-radius: 5px;
      border: 1px solid #27272a;
    }

    .start-addr-text {
      font-size: 0.75rem;
      color: #93c5fd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .inputs-container {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    label {
      font-size: 0.75rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    input[type="time"],
    input[type="number"] {
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      padding: 3px 5px;
      border-radius: 5px;
      font-size: 0.85rem;
      outline: none;
    }

    input[type="number"] {
      width: 50px;
      text-align: center;
    }

    .btn-group {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 5px 9px;
      border-radius: 5px;
      font-size: 0.78rem;
      cursor: pointer;
      font-weight: 600;
      color: #fff;
      transition: opacity 0.2s;
    }

    button:active {
      opacity: 0.7;
    }

    .btn-primary { background-color: var(--accent-blue); }
    .btn-orange { background-color: var(--accent-orange); }
    .btn-green { background-color: #059669; }
    .btn-red { background-color: #dc2626; }
    .btn-gray { background-color: #3f3f46; }

    .status-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #080808;
      padding: 6px 8px;
      border-radius: 6px;
      text-align: center;
      border: 1px solid #1f2937;
    }

    .status-item {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .status-label {
      font-size: 0.65rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-value {
      font-size: 1.15rem;
      font-weight: 700;
      transition: color 0.3s ease;
    }

    .color-green { color: var(--status-green); }
    .color-yellow { color: var(--status-yellow); }
    .color-red { color: var(--status-red); }

    .info-bar {
      font-size: 0.7rem;
      color: var(--text-sub);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      padding-top: 2px;
    }

    #map {
      flex: 1;
      width: 100%;
      background-color: #000;
    }

    /* Dunkler Look für Standard OSM Kacheln ohne Key */
    .leaflet-tile-pane {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);
    }

    .waypoint-badge {
      background-color: var(--accent-orange);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      border: 2px solid #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 5px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>

  <div id="dashboard">
    <div class="start-addr-row">
      <span id="startAddrDisplay" class="start-addr-text">Start: Noch nicht gesetzt</span>
      <button id="reloadStartBtn" class="btn-gray" title="Startadresse & Routing neu laden">🔄 Start laden</button>
    </div>

    <div class="controls-row">
      <div class="inputs-container">
        <div class="input-group">
          <label for="targetTime">Soll:</label>
          <input type="time" id="targetTime" />
        </div>
        <div class="input-group">
          <label for="reserveTime">Reserve:</label>
          <input type="number" id="reserveTime" value="30" min="0" max="180" step="5" />
          <span style="font-size: 0.7rem; color: var(--text-sub);">Min</span>
        </div>
      </div>
      <div class="btn-group">
        <button id="startWalkBtn" class="btn-green">▶ Start</button>
        <button id="addWaypointBtn" class="btn-orange">📍 Stopp</button>
        <button id="stopTourBtn" class="btn-red">⏹ Stop & GPX</button>
      </div>
    </div>

    <div class="status-panel">
      <div class="status-item">
        <span class="status-label">Rückkehr ab jetzt</span>
        <span id="etaDisplay" class="status-value color-green">--:--:--</span>
      </div>
      <div class="status-item">
        <span class="status-label">Zeitpuffer</span>
        <span id="bufferDisplay" class="status-value color-green">-- Min</span>
      </div>
    </div>

    <div class="info-bar">
      <span id="distDisplay">Rück: -- km</span>
      <span id="elevationDisplay">H: -- (↑0m)</span>
      <span id="trackPointsDisplay">Track: 0 Pkt</span>
      <span id="speedDisplay">3.5 km/h</span>
      <span id="isochroneStatus">Iso: Eco</span>
      <span id="waypointCountDisplay">Stopps: 0</span>
    </div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const WALKING_SPEED_KMH = 3.5;
    const DETOUR_FACTOR = 1.30;
    const ROUTING_DISTANCE_THRESHOLD_KM = 0.05; // Neuer Rückweg-Pfad ab 50 m
    const ISOCHRONE_RAYS = 12;
    const BATCH_SIZE = 4;
    const ISOCHRONE_RECALC_INTERVAL_MIN = 5;
    const STORAGE_KEY = "city_walk_tour_state_v2";

    // Kriterien für Track-Punkte: min. 15 Sekunden ODER min. 10 Meter
    const TRACK_TIME_THRESHOLD_MS = 15 * 1000;
    const TRACK_DIST_THRESHOLD_KM = 0.010; // 10 Meter

    let map = null;
    let startMarker = null;
    let currentMarker = null;
    let returnRouteLine = null;
    let walkedTrackLine = null;
    let isochronePolygon = null;

    let startCoord = null;
    let startAddress = "Noch nicht geladen";
    let currentCoord = null;
    let lastRoutedCoord = null;

    let currentAltitude = null;
    let totalElevationGain = 0;
    let lastValidEle = null;

    let routedDistanceMeters = 0;
    let routedDurationSeconds = 0;
    let isCalculatingIsochrone = false;
    let baseIsochroneMinutes = null;
    let baseIsochronePoints = [];

    let isRecording = false;
    let trackPoints = [];
    let waypoints = [];
    let waypointMarkers = [];
    let lastTrackPointTime = 0;

    let geoWatchId = null;
    let calcInterval = null;

    const targetInput = document.getElementById("targetTime");
    const reserveInput = document.getElementById("reserveTime");
    const startAddrDisplay = document.getElementById("startAddrDisplay");

    function saveStateToStorage() {
      if (!isRecording) return;
      const state = {
        isRecording,
        targetTime: targetInput.value,
        reserveTime: reserveInput.value,
        startCoord,
        startAddress,
        totalElevationGain,
        trackPoints,
        waypoints
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadStateFromStorage() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return false;

      try {
        const state = JSON.parse(saved);
        if (!state.isRecording) return false;

        isRecording = true;
        targetInput.value = state.targetTime || "14:00";
        reserveInput.value = state.reserveTime || "30";
        startCoord = state.startCoord;
        startAddress = state.startAddress || "Gespeicherter Startort";
        totalElevationGain = state.totalElevationGain || 0;
        trackPoints = state.trackPoints || [];
        waypoints = state.waypoints || [];

        startAddrDisplay.textContent = `Start: ${startAddress}`;
        document.getElementById("startWalkBtn").textContent = "🔄 Aktiv";
        document.getElementById("startWalkBtn").className = "btn-primary";
        return true;
      } catch (e) {
        return false;
      }
    }

    // Reverse Geocoding via OSM Nominatim (ohne API-Key)
    async function fetchAddress(lat, lng) {
      try {
        startAddrDisplay.textContent = "Start: Suche Adresse...";
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`);
        const data = await res.json();
        if (data && data.display_name) {
          const parts = data.display_name.split(",");
          startAddress = parts.slice(0, 3).join(",").trim();
        } else {
          startAddress = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        }
      } catch (e) {
        startAddress = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
      }
      startAddrDisplay.textContent = `Start: ${startAddress}`;
      saveStateToStorage();
    }

    function initMap(lat, lng) {
      map = L.map("map", { zoomControl: false }).setView([lat, lng], 16);

      // Standard OSM Kacheln (100% frei & schlüssellos)
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
      }).addTo(map);

      isochronePolygon = L.polygon([], {
        color: '#ef4444',
        fillColor: '#ef4444',
        fillOpacity: 0.12,
        weight: 1.5,
        dashArray: '3, 4'
      }).addTo(map);

      const startIcon = L.divIcon({
        className: '',
        html: "<div style='background-color:#3b82f6;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 5px rgba(0,0,0,0.8);'></div>",
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });

      const currentIcon = L.divIcon({
        className: '',
        html: "<div style='background-color:#10b981;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 5px rgba(0,0,0,0.8);'></div>",
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });

      startMarker = L.marker([startCoord ? startCoord.lat : lat, startCoord ? startCoord.lng : lng], { icon: startIcon })
        .addTo(map)
        .bindPopup("<b>Startpunkt</b>");

      currentMarker = L.marker([lat, lng], { icon: currentIcon })
        .addTo(map)
        .bindPopup("<b>Aktueller Ort</b>");

      returnRouteLine = L.polyline([], {
        color: '#3b82f6',
        weight: 4,
        opacity: 0.85,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      walkedTrackLine = L.polyline([], {
        color: '#ea580c',
        weight: 4,
        opacity: 0.95
      }).addTo(map);

      renderStoredWaypoints();
      updateWalkedPathDisplay();
    }

    function renderStoredWaypoints() {
      waypointMarkers.forEach(m => map.removeLayer(m));
      waypointMarkers = [];

      waypoints.forEach((wp) => {
        const wpIcon = L.divIcon({
          className: '',
          html: `<div class="waypoint-badge">${wp.number}</div>`,
          iconSize: [22, 22],
          iconAnchor: [11, 11]
        });

        const eleText = wp.ele !== null ? `<br>Höhe: ${Math.round(wp.ele)} m` : '';
        const m = L.marker([wp.lat, wp.lng], { icon: wpIcon })
          .addTo(map)
          .bindPopup(`<b>Stopp #${wp.number}</b><br>Zeit: ${wp.time}${eleText}`);
        waypointMarkers.push(m);
      });

      document.getElementById("waypointCountDisplay").textContent = `Stopps: ${waypoints.length}`;
    }

    function updateWalkedPathDisplay() {
      if (!walkedTrackLine) return;
      const latLngs = trackPoints.map(p => [p.lat, p.lng]);
      walkedTrackLine.setLatLngs(latLngs);
      document.getElementById("trackPointsDisplay").textContent = `Track: ${trackPoints.length} Pkt`;
    }

    async function fetchFootRoute() {
      if (!startCoord || !currentCoord) return;

      const url = `https://router.project-osrm.org/route/v1/foot/${currentCoord.lng},${currentCoord.lat};${startCoord.lng},${startCoord.lat}?overview=full&geometries=geojson`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          routedDistanceMeters = route.distance;
          routedDurationSeconds = (routedDistanceMeters / 1000 / WALKING_SPEED_KMH) * 3600;

          const latLngs = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);
          returnRouteLine.setLatLngs(latLngs);
        }
      } catch (err) {
        // Leise ignorieren
      }
    }

    async function calculateIsochrone12Rays(maxWalkMinutes) {
      if (!startCoord || maxWalkMinutes <= 0 || isCalculatingIsochrone) {
        if (maxWalkMinutes <= 0 && isochronePolygon) isochronePolygon.setLatLngs([]);
        return;
      }

      isCalculatingIsochrone = true;
      const maxDistMeters = (maxWalkMinutes / 60) * WALKING_SPEED_KMH * 1000;
      const boundaryPoints = new Array(ISOCHRONE_RAYS);

      const fetchRay = async (i) => {
        const angle = (i * 2 * Math.PI) / ISOCHRONE_RAYS;
        const latOffset = (maxDistMeters / 111320) * Math.cos(angle);
        const lngOffset = (maxDistMeters / (111320 * Math.cos(startCoord.lat * Math.PI / 180))) * Math.sin(angle);
        const testLat = startCoord.lat + latOffset;
        const testLng = startCoord.lng + lngOffset;

        const url = `https://router.project-osrm.org/route/v1/foot/${startCoord.lng},${startCoord.lat};${testLng},${testLat}?overview=full&geometries=geojson`;

        try {
          const response = await fetch(url);
          const data = await response.json();

          if (data.routes && data.routes.length > 0) {
            const route = data.routes[0];
            const routeWalkSeconds = (route.distance / 1000 / WALKING_SPEED_KMH) * 3600;
            const maxAllowedSeconds = maxWalkMinutes * 60;
            const coords = route.geometry.coordinates;

            if (coords && coords.length > 0) {
              if (routeWalkSeconds <= maxAllowedSeconds) {
                boundaryPoints[i] = [coords[coords.length - 1][1], coords[coords.length - 1][0]];
              } else {
                const fraction = maxAllowedSeconds / routeWalkSeconds;
                const targetIdx = Math.min(coords.length - 1, Math.floor(fraction * coords.length));
                boundaryPoints[i] = [coords[targetIdx][1], coords[targetIdx][0]];
              }
              return;
            }
          }
        } catch (e) {
          boundaryPoints[i] = [startCoord.lat + (latOffset / DETOUR_FACTOR), startCoord.lng + (lngOffset / DETOUR_FACTOR)];
          return;
        }

        boundaryPoints[i] = [startCoord.lat + (latOffset / DETOUR_FACTOR), startCoord.lng + (lngOffset / DETOUR_FACTOR)];
      };

      for (let i = 0; i < ISOCHRONE_RAYS; i += BATCH_SIZE) {
        const batch = [];
        for (let j = i; j < i + BATCH_SIZE && j < ISOCHRONE_RAYS; j++) {
          batch.push(fetchRay(j));
        }
        await Promise.all(batch);
      }

      baseIsochronePoints = boundaryPoints.filter(p => p !== undefined);
      baseIsochroneMinutes = maxWalkMinutes;

      if (baseIsochronePoints.length >= 3 && isochronePolygon) {
        isochronePolygon.setLatLngs(baseIsochronePoints);
        document.getElementById("isochroneStatus").textContent = `Iso: ~${Math.round(maxWalkMinutes)}m`;
      }

      isCalculatingIsochrone = false;
    }

    function scaleExistingIsochrone(currentMinutes) {
      if (!baseIsochronePoints.length || !baseIsochroneMinutes || baseIsochroneMinutes <= 0) return;
      const factor = currentMinutes / baseIsochroneMinutes;

      const scaledPoints = baseIsochronePoints.map(pt => {
        const lat = startCoord.lat + (pt[0] - startCoord.lat) * factor;
        const lng = startCoord.lng + (pt[1] - startCoord.lng) * factor;
        return [lat, lng];
      });

      if (isochronePolygon) isochronePolygon.setLatLngs(scaledPoints);
    }

    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function updateCalculations() {
      if (!startCoord || !currentCoord) return;

      const now = new Date();
      let walkMs = 0;
      let walkKm = 0;

      if (routedDistanceMeters > 0) {
        walkKm = routedDistanceMeters / 1000;
        walkMs = routedDurationSeconds * 1000;
      } else {
        walkKm = calculateDistanceKm(startCoord.lat, startCoord.lng, currentCoord.lat, currentCoord.lng) * DETOUR_FACTOR;
        walkMs = (walkKm / WALKING_SPEED_KMH) * 60 * 60 * 1000;
      }

      const expectedReturn = new Date(now.getTime() + walkMs);

      const [targetHours, targetMinutes] = targetInput.value.split(":").map(Number);
      const targetDate = new Date();
      targetDate.setHours(targetHours, targetMinutes, 0, 0);

      if (targetDate.getTime() < now.getTime() - 12 * 60 * 60 * 1000) {
        targetDate.setDate(targetDate.getDate() + 1);
      }

      const bufferMinutes = (targetDate.getTime() - expectedReturn.getTime()) / (60 * 1000);
      const reserveMinutes = parseFloat(reserveInput.value) || 0;

      const totalAvailableMinutes = (targetDate.getTime() - now.getTime()) / (60 * 1000) - (reserveMinutes / 2);
      const validMins = Math.max(0, totalAvailableMinutes);

      if (baseIsochroneMinutes === null || Math.abs(validMins - baseIsochroneMinutes) >= ISOCHRONE_RECALC_INTERVAL_MIN) {
        calculateIsochrone12Rays(validMins);
      } else {
        scaleExistingIsochrone(validMins);
      }

      const etaDisplay = document.getElementById("etaDisplay");
      const bufferDisplay = document.getElementById("bufferDisplay");
      const distDisplay = document.getElementById("distDisplay");
      const elevationDisplay = document.getElementById("elevationDisplay");

      etaDisplay.textContent = expectedReturn.toTimeString().substring(0, 8);
      bufferDisplay.textContent = `${Math.round(bufferMinutes)} Min`;
      distDisplay.textContent = `Rück: ${walkKm.toFixed(2)} km`;

      const eleText = currentAltitude !== null ? `${Math.round(currentAltitude)}m` : '--';
      elevationDisplay.textContent = `H: ${eleText} (↑${Math.round(totalElevationGain)}m)`;

      let colorClass = "color-green";
      if (bufferMinutes < reserveMinutes) {
        colorClass = "color-red";
      } else if (bufferMinutes <= reserveMinutes + 15) {
        colorClass = "color-yellow";
      }

      etaDisplay.className = `status-value ${colorClass}`;
      bufferDisplay.className = `status-value ${colorClass}`;
    }

    // Standort speichern / Wegpunkt mit Nummer
    function addWaypoint() {
      if (!currentCoord) return;

      const index = waypoints.length + 1;
      const isoTime = new Date().toISOString();
      const localTimeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      const pointData = {
        lat: currentCoord.lat,
        lng: currentCoord.lng,
        ele: currentAltitude !== null ? Number(currentAltitude.toFixed(1)) : null,
        time: localTimeStr,
        isoTime: isoTime,
        number: index
      };
      waypoints.push(pointData);

      const wpIcon = L.divIcon({
        className: '',
        html: `<div class="waypoint-badge">${index}</div>`,
        iconSize: [22, 22],
        iconAnchor: [11, 11]
      });

      const eleText = currentAltitude !== null ? `<br>Höhe: ${Math.round(currentAltitude)} m` : '';
      const marker = L.marker([currentCoord.lat, currentCoord.lng], { icon: wpIcon })
        .addTo(map)
        .bindPopup(`<b>Stopp #${index}</b><br>Zeit: ${localTimeStr}${eleText}`);

      waypointMarkers.push(marker);
      document.getElementById("waypointCountDisplay").textContent = `Stopps: ${waypoints.length}`;
      saveStateToStorage();
    }

    // Feinere Aufzeichnung: alle 15 Sekunden ODER alle 10 Meter
    function recordCurrentPosition(lat, lng, altitude) {
      if (!isRecording) return;
      const nowMs = Date.now();
      const nowIso = new Date(nowMs).toISOString();

      let shouldRecord = false;

      if (trackPoints.length === 0) {
        shouldRecord = true;
      } else {
        const last = trackPoints[trackPoints.length - 1];
        const distKm = calculateDistanceKm(lat, lng, last.lat, last.lng);
        const timeDiffMs = nowMs - lastTrackPointTime;

        if (distKm >= TRACK_DIST_THRESHOLD_KM || timeDiffMs >= TRACK_TIME_THRESHOLD_MS) {
          shouldRecord = true;
        }
      }

      if (!shouldRecord) return;

      lastTrackPointTime = nowMs;

      // Höhenanstieg berechnen
      if (altitude !== null) {
        if (lastValidEle !== null) {
          const diff = altitude - lastValidEle;
          if (diff >= 1.5) {
            totalElevationGain += diff;
            lastValidEle = altitude;
          } else if (diff <= -1.5) {
            lastValidEle = altitude;
          }
        } else {
          lastValidEle = altitude;
        }
      }

      trackPoints.push({
        lat,
        lng,
        ele: altitude !== null ? Number(altitude.toFixed(1)) : null,
        time: nowIso
      });

      updateWalkedPathDisplay();
      saveStateToStorage();
    }

    function handlePosition(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      currentAltitude = position.coords.altitude !== null && !isNaN(position.coords.altitude)
        ? position.coords.altitude
        : null;

      currentCoord = { lat, lng };

      if (!map) {
        if (!startCoord) {
          startCoord = { lat, lng, ele: currentAltitude };
          fetchAddress(lat, lng);
        }
        lastRoutedCoord = { lat, lng };
        initMap(lat, lng);
        fetchFootRoute();
      } else {
        currentMarker.setLatLng([lat, lng]);

        const distSinceLastRoute = calculateDistanceKm(lat, lng, lastRoutedCoord.lat, lastRoutedCoord.lng);
        if (distSinceLastRoute >= ROUTING_DISTANCE_THRESHOLD_KM) {
          lastRoutedCoord = { lat, lng };
          fetchFootRoute();
        }
      }

      recordCurrentPosition(lat, lng, currentAltitude);
      updateCalculations();
    }

    function startGpsWatch() {
      if ("geolocation" in navigator && geoWatchId === null) {
        geoWatchId = navigator.geolocation.watchPosition(handlePosition, (err) => {
          console.warn(`GPS-Fehler: ${err.message}`);
        }, {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 5000
        });
      }
    }

    // GPX-Export mit Route, Stopps und Höhenprofil
    function generateAndDownloadGPX() {
      let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n`;
      gpx += `<gpx version="1.1" creator="CityWalkTracker" xmlns="http://www.topografix.com/GPX/1/1">\n`;
      gpx += `  <metadata>\n    <name>City Walk Tour</name>\n    <time>${new Date().toISOString()}</time>\n  </metadata>\n`;

      if (startCoord) {
        gpx += `  <wpt lat="${startCoord.lat}" lon="${startCoord.lng}">\n`;
        if (startCoord.ele !== null && startCoord.ele !== undefined) gpx += `    <ele>${startCoord.ele}</ele>\n`;
        gpx += `    <name>Start: ${startAddress.replace(/&/g, '&amp;')}</name>\n  </wpt>\n`;
      }

      waypoints.forEach(wp => {
        gpx += `  <wpt lat="${wp.lat}" lon="${wp.lng}">\n`;
        if (wp.ele !== null && wp.ele !== undefined) gpx += `    <ele>${wp.ele}</ele>\n`;
        gpx += `    <name>Stopp #${wp.number}</name>\n    <time>${wp.isoTime || new Date().toISOString()}</time>\n  </wpt>\n`;
      });

      gpx += `  <trk>\n    <name>Gegangener Weg</name>\n    <trkseg>\n`;
      trackPoints.forEach(pt => {
        gpx += `      <trkpt lat="${pt.lat}" lon="${pt.lng}">\n`;
        if (pt.ele !== null && pt.ele !== undefined) gpx += `        <ele>${pt.ele}</ele>\n`;
        gpx += `        <time>${pt.time}</time>\n      </trkpt>\n`;
      });
      gpx += `    </trkseg>\n  </trk>\n</gpx>`;

      const blob = new Blob([gpx], { type: "application/gpx+xml" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const dateStr = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `city-walk-${dateStr}.gpx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // --- Buttons mit Sicherheitsabfragen ---

    // Start-Knopf (mit Bestätigung)
    document.getElementById("startWalkBtn").addEventListener("click", () => {
      if (isRecording) {
        const proceed = confirm("Es läuft bereits eine Tour. Möchtest du diese wirklich verwerfen und eine NEUE Tour am aktuellen Ort starten?");
        if (!proceed) return;
      }

      navigator.geolocation.getCurrentPosition((pos) => {
        isRecording = true;
        trackPoints = [];
        waypoints = [];
        totalElevationGain = 0;
        lastValidEle = null;
        lastTrackPointTime = 0;

        waypointMarkers.forEach(m => map && map.removeLayer(m));
        waypointMarkers = [];

        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        currentAltitude = pos.coords.altitude !== null && !isNaN(pos.coords.altitude) ? pos.coords.altitude : null;

        startCoord = { lat, lng, ele: currentAltitude };
        currentCoord = { lat, lng };
        lastRoutedCoord = { lat, lng };
        baseIsochroneMinutes = null;
        baseIsochronePoints = [];

        if (startMarker) startMarker.setLatLng([lat, lng]);
        if (currentMarker) currentMarker.setLatLng([lat, lng]);
        if (walkedTrackLine) walkedTrackLine.setLatLngs([]);
        if (isochronePolygon) isochronePolygon.setLatLngs([]);

        fetchAddress(lat, lng);
        recordCurrentPosition(lat, lng, currentAltitude);
        saveStateToStorage();
        fetchFootRoute();
        updateCalculations();

        document.getElementById("startWalkBtn").textContent = "🔄 Aktiv";
        document.getElementById("startWalkBtn").className = "btn-primary";
      }, (err) => {
        alert("GPS-Position konnte nicht ermittelt werden: " + err.message);
      }, { enableHighAccuracy: true });
    });

    // Startort neu laden
    document.getElementById("reloadStartBtn").addEventListener("click", () => {
      if (!startCoord) {
        alert("Kein Startpunkt vorhanden.");
        return;
      }
      fetchAddress(startCoord.lat, startCoord.lng);
      fetchFootRoute();
      updateCalculations();
    });

    // Stopp / Waypoint merken
    document.getElementById("addWaypointBtn").addEventListener("click", () => {
      navigator.geolocation.getCurrentPosition((pos) => {
        handlePosition(pos);
        addWaypoint();
      }, () => addWaypoint(), { enableHighAccuracy: true });
    });

    // Tour Stoppen & GPX Speichern (mit Bestätigung)
    document.getElementById("stopTourBtn").addEventListener("click", () => {
      if (!isRecording && trackPoints.length === 0 && waypoints.length === 0) {
        alert("Keine Tour aktiv.");
        return;
      }

      const confirmStop = confirm("Möchtest du die Tour wirklich beenden und die GPX-Datei herunterladen?");
      if (!confirmStop) return;

      generateAndDownloadGPX();
      isRecording = false;
      localStorage.removeItem(STORAGE_KEY);
      document.getElementById("startWalkBtn").textContent = "▶ Start";
      document.getElementById("startWalkBtn").className = "btn-green";
    });

    targetInput.addEventListener("change", () => {
      baseIsochroneMinutes = null;
      saveStateToStorage();
      updateCalculations();
    });

    reserveInput.addEventListener("input", () => {
      baseIsochroneMinutes = null;
      saveStateToStorage();
      updateCalculations();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (calcInterval) {
          clearInterval(calcInterval);
          calcInterval = null;
        }
      } else {
        updateCalculations();
        if (!calcInterval) {
          calcInterval = setInterval(updateCalculations, 1000);
        }
      }
    });

    // Initialisierung
    const hasRestored = loadStateFromStorage();
    if (!hasRestored) {
      const defaultTarget = new Date(Date.now() + 2 * 60 * 60 * 1000);
      targetInput.value = defaultTarget.toTimeString().substring(0, 5);
    }

    startGpsWatch();
    calcInterval = setInterval(updateCalculations, 1000);
  </script>
</body>
</html>

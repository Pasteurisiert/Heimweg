<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>City Walk Return & Waypoint Tracker</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-color: #121826;
      --card-bg: #1f2937;
      --text-main: #f9fafb;
      --text-sub: #9ca3af;
      --status-green: #10b981;
      --status-yellow: #f59e0b;
      --status-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-orange: #f97316;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Dashboard Header */
    #dashboard {
      background-color: var(--card-bg);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      z-index: 1000;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    input[type="time"] {
      background: #374151;
      border: 1px solid #4b5563;
      color: #fff;
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    button {
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 500;
      color: #fff;
      transition: opacity 0.2s;
    }

    button:active {
      opacity: 0.8;
    }

    .btn-primary { background-color: var(--accent-blue); }
    .btn-orange { background-color: var(--accent-orange); }

    /* Display Box */
    .status-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #111827;
      padding: 8px 10px;
      border-radius: 8px;
      text-align: center;
    }

    .status-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .status-label {
      font-size: 0.7rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-value {
      font-size: 1.2rem;
      font-weight: 700;
      transition: color 0.3s ease;
    }

    .color-green { color: var(--status-green); }
    .color-yellow { color: var(--status-yellow); }
    .color-red { color: var(--status-red); }

    .info-bar {
      font-size: 0.72rem;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
      padding-top: 2px;
    }

    /* Map */
    #map {
      flex: 1;
      width: 100%;
    }

    /* Custom Waypoint Icon Style */
    .waypoint-badge {
      background-color: var(--accent-orange);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      border: 2px solid #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 5px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <div id="dashboard">
    <div class="controls-row">
      <div class="input-group">
        <label for="targetTime">Soll:</label>
        <input type="time" id="targetTime" />
      </div>
      <div class="btn-group">
        <button id="addWaypointBtn" class="btn-orange">📍 Punkt merken</button>
        <button id="setStartBtn" class="btn-primary">Neuer Start</button>
      </div>
    </div>

    <div class="status-panel">
      <div class="status-item">
        <span class="status-label">Rückkehr ab jetzt</span>
        <span id="etaDisplay" class="status-value color-green">--:--:--</span>
      </div>
      <div class="status-item">
        <span class="status-label">Zeitpuffer</span>
        <span id="bufferDisplay" class="status-value color-green">-- Min</span>
      </div>
    </div>

    <div class="info-bar">
      <span id="distDisplay">Rückweg: -- km</span>
      <span id="walkDurationDisplay">Gehzeit: -- Min</span>
      <span id="waypointCountDisplay">Markierungen: 0</span>
    </div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const WALKING_SPEED_KMH = 4.5;

    let map = null;
    let startMarker = null;
    let currentMarker = null;
    let returnRouteLine = null;
    let walkedTrackLine = null;

    let startCoord = null;
    let currentCoord = null;
    let lastFetchedCoord = null;

    let routedDistanceMeters = 0;
    let routedDurationSeconds = 0;

    // Array für gespeicherte Wegpunkte
    const waypoints = [];
    const waypointMarkers = [];

    // Standard-Rückkehrzeit (Jetzt + 2 Stunden)
    const targetInput = document.getElementById("targetTime");
    const defaultTarget = new Date(Date.now() + 2 * 60 * 60 * 1000);
    targetInput.value = defaultTarget.toTimeString().substring(0, 5);

    function initMap(lat, lng) {
      map = L.map("map", { zoomControl: false }).setView([lat, lng], 16);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
      }).addTo(map);

      // Startpunkt-Icon (Blau)
      const startIcon = L.divIcon({
        className: '',
        html: "<div style='background-color:#3b82f6;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 5px rgba(0,0,0,0.6);'></div>",
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });

      // Aktueller Standort-Icon (Grün)
      const currentIcon = L.divIcon({
        className: '',
        html: "<div style='background-color:#10b981;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px rgba(0,0,0,0.6);'></div>",
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });

      startMarker = L.marker([lat, lng], { icon: startIcon }).addTo(map).bindPopup("<b>Startpunkt</b>");
      currentMarker = L.marker([lat, lng], { icon: currentIcon }).addTo(map).bindPopup("<b>Aktueller Ort</b>");

      // Blaue Linie für den berechneten Rückweg
      returnRouteLine = L.polyline([], {
        color: '#3b82f6',
        weight: 5,
        opacity: 0.85,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      // Orange gestrichelte Linie für den zurückgelegten Weg der Zwischenstopps
      walkedTrackLine = L.polyline([[lat, lng]], {
        color: '#f97316',
        weight: 3,
        dashArray: '6, 6',
        opacity: 0.9
      }).addTo(map);
    }

    // OSRM Fußweg-Routing für den Rückweg
    async function fetchFootRoute() {
      if (!startCoord || !currentCoord) return;

      const url = `https://router.project-osrm.org/route/v1/foot/${currentCoord.lng},${currentCoord.lat};${startCoord.lng},${startCoord.lat}?overview=full&geometries=geojson`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          routedDistanceMeters = route.distance;
          routedDurationSeconds = (routedDistanceMeters / 1000 / WALKING_SPEED_KMH) * 3600;

          const latLngs = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);
          returnRouteLine.setLatLngs(latLngs);
        }
      } catch (err) {
        console.warn("Routing-API nicht erreichbar, nutze Schätzung:", err);
      }
    }

    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function updateCalculations() {
      if (!startCoord || !currentCoord) return;

      const now = new Date();
      let walkMs = 0;
      let walkKm = 0;

      if (routedDistanceMeters > 0) {
        walkKm = routedDistanceMeters / 1000;
        walkMs = routedDurationSeconds * 1000;
      } else {
        walkKm = calculateDistanceKm(startCoord.lat, startCoord.lng, currentCoord.lat, currentCoord.lng) * 1.3;
        walkMs = (walkKm / WALKING_SPEED_KMH) * 60 * 60 * 1000;
      }

      const expectedReturn = new Date(now.getTime() + walkMs);

      const [targetHours, targetMinutes] = targetInput.value.split(":").map(Number);
      const targetDate = new Date();
      targetDate.setHours(targetHours, targetMinutes, 0, 0);

      if (targetDate.getTime() < now.getTime() - 12 * 60 * 60 * 1000) {
        targetDate.setDate(targetDate.getDate() + 1);
      }

      const bufferMinutes = (targetDate.getTime() - expectedReturn.getTime()) / (60 * 1000);

      const etaDisplay = document.getElementById("etaDisplay");
      const bufferDisplay = document.getElementById("bufferDisplay");
      const distDisplay = document.getElementById("distDisplay");
      const walkDurationDisplay = document.getElementById("walkDurationDisplay");

      etaDisplay.textContent = expectedReturn.toTimeString().substring(0, 8);
      bufferDisplay.textContent = `${Math.round(bufferMinutes)} Min`;
      distDisplay.textContent = `Rückweg: ${walkKm.toFixed(2)} km`;
      walkDurationDisplay.textContent = `Gehzeit: ~${Math.round(walkMs / 60000)} Min`;

      let colorClass = "color-green";
      if (bufferMinutes < 30) {
        colorClass = "color-red";
      } else if (bufferMinutes <= 45) {
        colorClass = "color-yellow";
      }

      etaDisplay.className = `status-value ${colorClass}`;
      bufferDisplay.className = `status-value ${colorClass}`;
    }

    // Wegpunkt speichern
    function addWaypoint() {
      if (!currentCoord) return;

      const index = waypoints.length + 1;
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const distFromStart = calculateDistanceKm(startCoord.lat, startCoord.lng, currentCoord.lat, currentCoord.lng).toFixed(2);

      const pointData = {
        lat: currentCoord.lat,
        lng: currentCoord.lng,
        time: timeStr,
        number: index
      };
      waypoints.push(pointData);

      // Marker mit Ziffer erstellen
      const wpIcon = L.divIcon({
        className: '',
        html: `<div class="waypoint-badge">${index}</div>`,
        iconSize: [22, 22],
        iconAnchor: [11, 11]
      });

      const marker = L.marker([currentCoord.lat, currentCoord.lng], { icon: wpIcon })
        .addTo(map)
        .bindPopup(`<b>Stopp #${index}</b><br>Uhrzeit: ${timeStr}<br>Luftlinie Start: ${distFromStart} km`);

      waypointMarkers.push(marker);

      // Pfad des gegangenen Weges aktualisieren (Startpunkt -> Stopp 1 -> Stopp 2 ...)
      const trackCoords = [
        [startCoord.lat, startCoord.lng],
        ...waypoints.map(w => [w.lat, w.lng]),
        [currentCoord.lat, currentCoord.lng]
      ];
      walkedTrackLine.setLatLngs(trackCoords);

      document.getElementById("waypointCountDisplay").textContent = `Markierungen: ${waypoints.length}`;
    }

    function handlePosition(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      if (!startCoord) {
        startCoord = { lat, lng };
        currentCoord = { lat, lng };
        initMap(lat, lng);
        fetchFootRoute();
      } else {
        currentCoord = { lat, lng };
        currentMarker.setLatLng([lat, lng]);

        // Den aktuellen Strang der gelaufenen Linie zum aktuellen Standort fortführen
        const trackCoords = [
          [startCoord.lat, startCoord.lng],
          ...waypoints.map(w => [w.lat, w.lng]),
          [lat, lng]
        ];
        walkedTrackLine.setLatLngs(trackCoords);

        // Routing nur bei deutlicher Bewegung (>30m) neu anfragen
        if (!lastFetchedCoord || calculateDistanceKm(lat, lng, lastFetchedCoord.lat, lastFetchedCoord.lng) > 0.03) {
          lastFetchedCoord = { lat, lng };
          fetchFootRoute();
        }
      }

      updateCalculations();
    }

    function handleError(error) {
      console.warn(`GPS-Fehler: ${error.message}`);
    }

    // Button-Events
    document.getElementById("addWaypointBtn").addEventListener("click", addWaypoint);

    document.getElementById("setStartBtn").addEventListener("click", () => {
      if (currentCoord) {
        // Alten Verlauf & Marker löschen
        waypointMarkers.forEach(m => map.removeLayer(m));
        waypointMarkers.length = 0;
        waypoints.length = 0;

        startCoord = { ...currentCoord };
        startMarker.setLatLng([startCoord.lat, startCoord.lng]);
        walkedTrackLine.setLatLngs([[startCoord.lat, startCoord.lng]]);
        returnRouteLine.setLatLngs([]);

        document.getElementById("waypointCountDisplay").textContent = "Markierungen: 0";

        fetchFootRoute();
        updateCalculations();
      }
    });

    targetInput.addEventListener("change", updateCalculations);

    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(handlePosition, handleError, {
        enableHighAccuracy: true,
        maximumAge: 5000,
        timeout: 10000
      });
    }

    setInterval(updateCalculations, 1000);
  </script>
</body>
</html>

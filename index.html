<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>City Walk Return Tracker (Puffer-Radius)</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-color: #121826;
      --card-bg: #1f2937;
      --text-main: #f9fafb;
      --text-sub: #9ca3af;
      --status-green: #10b981;
      --status-yellow: #f59e0b;
      --status-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-orange: #f97316;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #dashboard {
      background-color: var(--card-bg);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      z-index: 1000;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    input[type="time"] {
      background: #374151;
      border: 1px solid #4b5563;
      color: #fff;
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    button {
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 500;
      color: #fff;
      transition: opacity 0.2s;
    }

    button:active {
      opacity: 0.8;
    }

    .btn-primary { background-color: var(--accent-blue); }
    .btn-orange { background-color: var(--accent-orange); }

    .status-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #111827;
      padding: 8px 10px;
      border-radius: 8px;
      text-align: center;
    }

    .status-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .status-label {
      font-size: 0.7rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-value {
      font-size: 1.2rem;
      font-weight: 700;
      transition: color 0.3s ease;
    }

    .color-green { color: var(--status-green); }
    .color-yellow { color: var(--status-yellow); }
    .color-red { color: var(--status-red); }

    .info-bar {
      font-size: 0.72rem;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
      padding-top: 2px;
    }

    #map {
      flex: 1;
      width: 100%;
    }

    .waypoint-badge {
      background-color: var(--accent-orange);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      border: 2px solid #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 5px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <div id="dashboard">
    <div class="controls-row">
      <div class="input-group">
        <label for="targetTime">Soll:</label>
        <input type="time" id="targetTime" />
      </div>
      <div class="btn-group">
        <button id="addWaypointBtn" class="btn-orange">📍 Punkt merken</button>
        <button id="setStartBtn" class="btn-primary">Neuer Start</button>
      </div>
    </div>

    <div class="status-panel">
      <div class="status-item">
        <span class="status-label">Rückkehr ab jetzt</span>
        <span id="etaDisplay" class="status-value color-green">--:--:--</span>
      </div>
      <div class="status-item">
        <span class="status-label">Zeitpuffer</span>
        <span id="bufferDisplay" class="status-value color-green">-- Min</span>
      </div>
    </div>

    <div class="info-bar">
      <span id="distDisplay">Rückweg: -- km</span>
      <span id="radiusDisplay">30m-Puffer-Radius: -- m</span>
      <span id="waypointCountDisplay">Markierungen: 0</span>
    </div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const WALKING_SPEED_KMH = 4.5;
    const DETOUR_FACTOR = 1.30;
    const GPS_POLL_INTERVAL_MS = 60 * 1000;
    const ROUTING_DISTANCE_THRESHOLD_KM = 0.10; // 100 m Schwelle

    let map = null;
    let startMarker = null;
    let currentMarker = null;
    let returnRouteLine = null;
    let walkedTrackLine = null;
    let bufferCircle = null;

    let startCoord = null;
    let currentCoord = null;
    let lastRoutedCoord = null;

    let routedDistanceMeters = 0;
    let routedDurationSeconds = 0;

    const waypoints = [];
    const waypointMarkers = [];

    const targetInput = document.getElementById("targetTime");
    const defaultTarget = new Date(Date.now() + 2 * 60 * 60 * 1000);
    targetInput.value = defaultTarget.toTimeString().substring(0, 5);

    function initMap(lat, lng) {
      map = L.map("map", { zoomControl: false }).setView([lat, lng], 16);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
      }).addTo(map);

      // 30-Minuten-Pufferzone um den Startpunkt
      bufferCircle = L.circle([lat, lng], {
        radius: 0,
        color: '#ef4444',
        fillColor: '#ef4444',
        fillOpacity: 0.12,
        weight: 1.5,
        dashArray: '4, 4'
      }).addTo(map);

      const startIcon = L.divIcon({
        className: '',
        html: "<div style='background-color:#3b82f6;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 5px rgba(0,0,0,0.6);'></div>",
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });

      const currentIcon = L.divIcon({
        className: '',
        html: "<div style='background-color:#10b981;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px rgba(0,0,0,0.6);'></div>",
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });

      startMarker = L.marker([lat, lng], { icon: startIcon }).addTo(map).bindPopup("<b>Startpunkt</b>");
      currentMarker = L.marker([lat, lng], { icon: currentIcon }).addTo(map).bindPopup("<b>Aktueller Ort</b>");

      returnRouteLine = L.polyline([], {
        color: '#3b82f6',
        weight: 5,
        opacity: 0.85,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      walkedTrackLine = L.polyline([[lat, lng]], {
        color: '#f97316',
        weight: 3,
        dashArray: '6, 6',
        opacity: 0.9
      }).addTo(map);
    }

    async function fetchFootRoute() {
      if (!startCoord || !currentCoord) return;

      const url = `https://router.project-osrm.org/route/v1/foot/${currentCoord.lng},${currentCoord.lat};${startCoord.lng},${startCoord.lat}?overview=full&geometries=geojson`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          routedDistanceMeters = route.distance;
          routedDurationSeconds = (routedDistanceMeters / 1000 / WALKING_SPEED_KMH) * 3600;

          const latLngs = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);
          returnRouteLine.setLatLngs(latLngs);
        }
      } catch (err) {
        console.warn("Routing-API nicht erreichbar:", err);
      }
    }

    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function updateCalculations() {
      if (!startCoord || !currentCoord) return;

      const now = new Date();
      let walkMs = 0;
      let walkKm = 0;

      if (routedDistanceMeters > 0) {
        walkKm = routedDistanceMeters / 1000;
        walkMs = routedDurationSeconds * 1000;
      } else {
        walkKm = calculateDistanceKm(startCoord.lat, startCoord.lng, currentCoord.lat, currentCoord.lng) * DETOUR_FACTOR;
        walkMs = (walkKm / WALKING_SPEED_KMH) * 60 * 60 * 1000;
      }

      const expectedReturn = new Date(now.getTime() + walkMs);

      const [targetHours, targetMinutes] = targetInput.value.split(":").map(Number);
      const targetDate = new Date();
      targetDate.setHours(targetHours, targetMinutes, 0, 0);

      if (targetDate.getTime() < now.getTime() - 12 * 60 * 60 * 1000) {
        targetDate.setDate(targetDate.getDate() + 1);
      }

      const bufferMinutes = (targetDate.getTime() - expectedReturn.getTime()) / (60 * 1000);

      // --- Dynamischer Radius für 30 Minuten Puffer ---
      // Verfügbare Gesamtzeit bis Zielzeit minus 30 Min Puffer
      const totalAvailableMinutes = (targetDate.getTime() - now.getTime()) / (60 * 1000) - 30;
      let maxRadiusMeters = 0;

      if (totalAvailableMinutes > 0) {
        const allowedWalkHours = totalAvailableMinutes / 60;
        const allowedWalkKm = allowedWalkHours * WALKING_SPEED_KMH;
        // Luftlinienradius bereinigt um Stadt-Wegenetzfaktor
        maxRadiusMeters = (allowedWalkKm / DETOUR_FACTOR) * 1000;
      }

      if (bufferCircle) {
        bufferCircle.setRadius(Math.max(0, maxRadiusMeters));
      }

      const etaDisplay = document.getElementById("etaDisplay");
      const bufferDisplay = document.getElementById("bufferDisplay");
      const distDisplay = document.getElementById("distDisplay");
      const radiusDisplay = document.getElementById("radiusDisplay");

      etaDisplay.textContent = expectedReturn.toTimeString().substring(0, 8);
      bufferDisplay.textContent = `${Math.round(bufferMinutes)} Min`;
      distDisplay.textContent = `Rückweg: ${walkKm.toFixed(2)} km`;
      radiusDisplay.textContent = maxRadiusMeters > 0 ? `Max. Radius: ${(maxRadiusMeters / 1000).toFixed(2)} km` : `Max. Radius: 0 m`;

      let colorClass = "color-green";
      if (bufferMinutes < 30) {
        colorClass = "color-red";
      } else if (bufferMinutes <= 45) {
        colorClass = "color-yellow";
      }

      etaDisplay.className = `status-value ${colorClass}`;
      bufferDisplay.className = `status-value ${colorClass}`;
    }

    function addWaypoint() {
      if (!currentCoord) return;

      const index = waypoints.length + 1;
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const distFromStart = calculateDistanceKm(startCoord.lat, startCoord.lng, currentCoord.lat, currentCoord.lng).toFixed(2);

      const pointData = {
        lat: currentCoord.lat,
        lng: currentCoord.lng,
        time: timeStr,
        number: index
      };
      waypoints.push(pointData);

      const wpIcon = L.divIcon({
        className: '',
        html: `<div class="waypoint-badge">${index}</div>`,
        iconSize: [22, 22],
        iconAnchor: [11, 11]
      });

      const marker = L.marker([currentCoord.lat, currentCoord.lng], { icon: wpIcon })
        .addTo(map)
        .bindPopup(`<b>Stopp #${index}</b><br>Uhrzeit: ${timeStr}<br>Luftlinie Start: ${distFromStart} km`);

      waypointMarkers.push(marker);

      const trackCoords = [
        [startCoord.lat, startCoord.lng],
        ...waypoints.map(w => [w.lat, w.lng]),
        [currentCoord.lat, currentCoord.lng]
      ];
      walkedTrackLine.setLatLngs(trackCoords);

      document.getElementById("waypointCountDisplay").textContent = `Markierungen: ${waypoints.length}`;
    }

    function handlePosition(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      if (!startCoord) {
        startCoord = { lat, lng };
        currentCoord = { lat, lng };
        lastRoutedCoord = { lat, lng };
        initMap(lat, lng);
        fetchFootRoute();
      } else {
        currentCoord = { lat, lng };
        currentMarker.setLatLng([lat, lng]);

        const trackCoords = [
          [startCoord.lat, startCoord.lng],
          ...waypoints.map(w => [w.lat, w.lng]),
          [lat, lng]
        ];
        walkedTrackLine.setLatLngs(trackCoords);

        const distSinceLastRoute = calculateDistanceKm(lat, lng, lastRoutedCoord.lat, lastRoutedCoord.lng);
        if (distSinceLastRoute >= ROUTING_DISTANCE_THRESHOLD_KM) {
          lastRoutedCoord = { lat, lng };
          fetchFootRoute();
        }
      }

      updateCalculations();
    }

    function requestLocation() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(handlePosition, (err) => {
          console.warn(`GPS-Fehler: ${err.message}`);
        }, {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 10000
        });
      }
    }

    document.getElementById("addWaypointBtn").addEventListener("click", () => {
      navigator.geolocation.getCurrentPosition((pos) => {
        handlePosition(pos);
        addWaypoint();
      }, () => addWaypoint());
    });

    document.getElementById("setStartBtn").addEventListener("click", () => {
      if (currentCoord) {
        waypointMarkers.forEach(m => map.removeLayer(m));
        waypointMarkers.length = 0;
        waypoints.length = 0;

        startCoord = { ...currentCoord };
        lastRoutedCoord = { ...currentCoord };
        startMarker.setLatLng([startCoord.lat, startCoord.lng]);
        bufferCircle.setLatLng([startCoord.lat, startCoord.lng]);
        walkedTrackLine.setLatLngs([[startCoord.lat, startCoord.lng]]);
        returnRouteLine.setLatLngs([]);

        document.getElementById("waypointCountDisplay").textContent = "Markierungen: 0";

        fetchFootRoute();
        updateCalculations();
      }
    });

    targetInput.addEventListener("change", updateCalculations);

    requestLocation();
    setInterval(requestLocation, GPS_POLL_INTERVAL_MS);
    setInterval(updateCalculations, 1000);
  </script>
</body>
</html>
